{% extends "base.html" %}

{% block title %}Rezervace{% endblock %}

{% block content %}
<div class="auth-panel mx-auto">
    <h1 class="restaurant-detail-name mb-2 text-center">Rezervace</h1>
    <p class="text-center text-muted mb-4">{{ restaurant.nazev }}</p>

    <form method="post" class="card shadow-sm auth-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-restaurant-primary w-100">Odeslat rezervaci</button>
    </form>
</div>
{% endblock %}
